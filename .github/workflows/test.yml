name: Postflow tests

on:
  push:
    branches:
      - main
      - phase-1/reliability
      - phase-2/deployment
  pull_request:
    branches:
      - main
      - phase-1/reliability

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
